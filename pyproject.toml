[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "promofinder-ai"
version = "1.0.0"
description = "A screenplay-based microdrama promo discovery pipeline"
requires-python = ">=3.9"
dependencies = ["pydantic>=2.0,<3.0", "python-dotenv>=1.0,<2.0"]

[project.optional-dependencies]
reports = ["pandas>=2.0"]
dev = ["pytest>=8.0"]
ui = ["streamlit>=1.40; python_version >= '3.11'"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
